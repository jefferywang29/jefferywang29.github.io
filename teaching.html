---
layout: default
title: Teaching
navbar_title: Teaching
permalink: /teaching/
container_class: container-lg
---

<div class="row">

  <!-- LEFT (or RIGHT) column: profile card -->
  <div class="col-lg-3 col-md-4">
      {% include widgets/profile_card_mini.html %}
  </div>

  <!-- MAIN column: Teaching content -->
  <div class="col-lg-9 col-md-8">

      <!-- <h1 class="pt-4 mb-4">Teaching</h1> -->

      {% assign items = site.teaching | sort: "date" | reverse | where: "show", true %}

      {% for item in items %}
        <div class="mb-4">
          <div class="{% if item.class %}{{ item.class }}{% else %}card border-0 shadow-sm bg-white{% endif %}">
            {{ item.content }}
          </div>
        </div>
      {% endfor %}

  </div>

</div>
