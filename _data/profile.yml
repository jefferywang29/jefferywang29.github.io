short_bio: >-
  <p>    
    Welcome to my website! I am a Ph.D. candidate in <a href="https://polisci.indiana.edu/index.html" target="_blank"> Political Science </a> and <a href="https://informatics.indiana.edu/index.html" target="_blank"> Informatics </a> at Indiana University Bloomington and a 2025–2026 job-market candidate. 
    I am part of the NSF-funded <a href="https://luddy.indiana.edu/academics/grad-programs/training-grants/index.html" target="_blank"> Interdisciplinary Dual Ph.D. Program in Complex Networks and Systems.</a> 
  </p>



  </p>
    My research bridges international relations and computational social science, focusing on how non-binding international institutions enable strategic cooperation through informal, networked alignments. 
    My dissertation explains why non-binding IGOs like APEC remain effective despite lacking enforcement mechanisms. 
    I show that cooperation arises from relational (networked), strategic alignments such as balancing, bandwagoning, or hedging, rather than formal rules. 
    Using temporal ERGMs on APEC co-sponsorship networks (2006–2019), I find that states form issue-specific coalitions through strategic bandwagoning—expressed as 
    friend-of-friend clustering conditioned on both target-specific influence and the attributes of shared partners, with dynamics that differ across high- and low-politics domains. 
    The findings reveal a cooperative structure in which influential members anchor collaboration while others align through relational pathways shaped by 
    existing ties, demonstrating that non-binding IGOs like APEC remain strategically valuable because they enable flexible, network-based forms of cooperation that persist even without formal enforcement. 
    For more details, please go to my <a href="/academic-homepage/publications"> research page.</a> 
  </p>
  <p>
    My research is informed by previous professional experience as a coordinator of the APEC SME Working Group for the Taiwanese government. 
    I am also working on projects with other IR scholars related to ISO standardization politics and legal institutions in climate-related human trafficking. 
    These works are currently under review in political science journals.
  </p>
  <p> 
    At Indiana University, I have taught across Political Science and Informatics, serving as instructor of record for 
    Data Fluency and Politics of Global Governance, and as associate instructor for Analyzing Politics, Data Fluency, International Organizations, and Introduction to Informatics.
  <p>
  <p>
    My research has been supported by Taiwanese Overseas Pioneers Grant from the National Science and Technology Council to fund my Ph.D. dissertation, 
    along with a four-year fellowship for doctoral study abroad from the Taiwanese Ministry of Education. 
    I hold an M.A. in International Relations from National Taiwan University and a B.A. in Political Science from Chinese Culture University.
  </p>

