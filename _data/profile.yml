short_bio: >-
  <p>    
    Weclome to my website! I am a Ph.D. candidate in <a href="https://polisci.indiana.edu/index.html" target="_blank"> Political Science </a> and <a href="https://informatics.indiana.edu/index.html" target="_blank"> Informatics </a> at Indiana University Bloomington. 
    I am part of the NSF-funded <a href="https://cns.iu.edu/docs/handouts/CNetS-NRT-lo.pdf" target="_blank"> Interdisciplinary Dual Ph.D. Program in Complex Networks and Systems</a>. The program is discussed in a recent study published in <a href="https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0334779" target="_blank">PLOS ONE</a>.
  </p>



  </p>
   My research bridges international relations and computational social science to explain how global cooperation and contestation unfold through informal institutions, relational structures, and networked forms of power. 
   I am especially interested in how international order is sustained, adapted, or contested when formal rules are weak, authority is fragmented, and states rely on flexible patterns of alignment rather than binding commitments. 
   My dissertation examines this question through the case of APEC, showing why non-binding IGOs can remain effective even without strong enforcement mechanisms. 
   I argue that cooperation in such settings emerges through strategic, networked alignments such as balancing, bandwagoning, and hedging. 
   Using temporal ERGMs on APEC co-sponsorship networks from 2006 to 2019, I show that states form issue-specific coalitions through relational pathways shaped by existing ties, with influential members anchoring collaboration and others aligning through friend-of-friend structures conditioned by power, institutional position, and issue domain. These findings demonstrate that non-binding institutions remain strategically valuable because they provide flexible arenas for network-based cooperation under changing geopolitical conditions.
   </a>.
  </p>

  <p>
  More broadly, my current research agenda examines how states compete and cooperate across multiple issue areas central to contemporary global order, including regional governance, standard-setting, climate-related human trafficking, and China’s role in international institutions. 
  In one line of work, I study the politics of ISO standardization to understand how influence operates in ostensibly technical arenas and how standard-setting institutions may reflect broader patterns of geopolitical competition and coordination. 
  In another, I examine how legal institutions and environmental shocks reshape human trafficking networks, with particular attention to how climate-related pressures alter routes, vulnerabilities, and institutional responses. 
  A collaborative paper from this project is currently under revise-and-resubmit at <em>International Studies Quarterly</em>. Across these projects, I ask how power operates through networks, how institutional arrangements shape strategic behavior, and how emerging global challenges are reorganizing cooperation in the contemporary international system. For more details, please go to my <a href="/research/">research page</a>.
  <p>

  <p>
    My research is also informed by prior professional experience as a coordinator of the APEC SME Working Group for the Taiwanese government, which gave me firsthand exposure to the practical politics of non-binding regional cooperation. 
  </p>
  <p> 
    At Indiana University, I have taught across Political Science and Informatics, serving as instructor of record for 
    Data Fluency and Politics of Global Governance, and as associate instructor for Analyzing Politics, Data Fluency, International Organizations, and Introduction to Informatics. 
    For more details, please go to my <a href="/teaching/">teaching page</a>.

  <p>
  <p>
    My research has been supported by Taiwanese Overseas Pioneers Grant from the National Science and Technology Council to fund my Ph.D. dissertation, 
    along with a four-year fellowship for doctoral study abroad from the Taiwanese Ministry of Education. 
    I hold an M.A. in International Relations from National Taiwan University and a B.A. in Political Science from Chinese Culture University.
  </p>

