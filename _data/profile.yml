short_bio: >-
  <p>
    Welcome to my website. I recently completed my Ph.D. 
    in <a href="https://polisci.indiana.edu/index.html" target="_blank">Political Science</a> 
    at Indiana University Bloomington, 
    where I also pursued interdisciplinary training in 
    <a href="https://informatics.indiana.edu/index.html" target="_blank">Informatics</a> 
    through the 
    <a href="https://cns.iu.edu/docs/handouts/CNetS-NRT-lo.pdf" target="_blank">Interdisciplinary Dual Ph.D. Program 
    in Complex Networks and Systems</a>.
  </p>

  <p>
    I study how global order changes, and I treat that change as three simultaneous dynamics rather than a single story of decline: 
    <em>rupture</em>, as major powers withdraw selectively and reach for unilateral instruments; 
    <em>reconfiguration</em>, as middle powers build flexible alternatives to institutions they can no longer rely on; and 
    <em>reinforcement</em>, as rising powers work through existing liberal frameworks from the inside. 
    Trade is the pivotal network where all three become visible. 
    Methodologically, I treat institutions as relational structures rather than containers, 
      using temporal and multilayer network models, exponential random graph models, hypergraph and bipartite analysis, 
      computational text analysis, and graph neural network modeling.
  </p>

  <p>
    My dissertation, defended in August 2026, asks why soft-law and non-binding intergovernmental organizations remain effective despite weak enforcement. 
    Using APEC project cosponsorship networks, I show that cooperation is sustained by relational hierarchy rather than formal rules. 
      Smaller economies bandwagon with influential actors—whether influential because of their material attributes or their structural positions 
      in the network—rather than hedge against them. 
      These interactions form transitive brokerage clusters whose organizing logic varies across issue domains.
  </p>

  <p>
    Related work examines how disaster shocks and anti-trafficking laws reshape human trafficking networks, with a coauthored paper conditionally accepted at <em>International Studies Quarterly</em>;
    how China participates in international institutions through its growing role in ISO standard-setting;
    how states lacking control of material chokepoints substitute regulatory ones through standards leadership in ISO and IEC;
    and how the global order absorbs or fails to absorb rupture.
    Before my Ph.D., I worked on APEC policy and capacity-building at the Taiwan Institute of Economic Research and served as coordinator for
    Taiwan&rsquo;s Bureau of Small and Medium Enterprise to APEC. For more, see my <a href="/research/" target="_blank">research page</a>.
    I am also a coauthor of an introductory political science textbook published in Chinese.
  </p>

  <p>
    I regard teaching as inseparable from research, and the chance to teach was one reason I left several years of policy work for doctoral study. 
    At Indiana University I was Instructor of Record for <em>Politics of Global Governance</em> and <em>Data Fluency</em>, and 
    Associate Instructor for <em>International Organization</em>, <em>Analyzing Politics</em>, and <em>Introduction to Informatics</em>. 
    My classrooms are built around active learning and around a question generative AI has made urgent: 
    as routine execution becomes inexpensive, the distinctly human contribution moves upstream to problem definition and downstream to judgment and communication. 
    See my <a href="/teaching/" target="_blank">teaching page</a> and my <a href="https://jeffery-wang.com/r-basics/" target="_blank">R Tutorial</a>.
  </p>

  <p>
    My research and doctoral training have been supported by the Taiwanese Overseas Pioneers Ph.D. Dissertation Grant from
    Taiwan&rsquo;s National Science and Technology Council (USD 30,000), the Taiwanese Government Fellowship for Overseas Ph.D. Study
    from the Ministry of Education (USD 188,000), and 
    the U.S. National Science Foundation through the Interdisciplinary Training in Complex Networks and Systems program at Indiana University (NSF Award #1735095).
  </p>


# short_bio: >-
#   <p>
#     Welcome to my website. I recently completed my Ph.D. in <a href="https://polisci.indiana.edu/index.html" target="_blank">Political Science</a> at Indiana University Bloomington, where I also pursued interdisciplinary training in <a href="https://informatics.indiana.edu/index.html" target="_blank">Informatics</a> through the NSF-funded <a href="https://cns.iu.edu/docs/handouts/CNetS-NRT-lo.pdf" target="_blank">Interdisciplinary Dual Ph.D. Program in Complex Networks and Systems</a>.
#   </p>

#   <p>
#     My research examines how global governance and international cooperation evolve through relational networks, institutional design, domestic legalization, and external shocks such as climate change. I focus on three main areas: strategic alignment in international institutions, especially informal and non-binding ones; how domestic policies and climate-related shocks reshape transnational flows of people, goods, and vulnerability; and how cooperation networks shape the resilience and evolution of global order. Methodologically, I draw on multimodal data processing, social network analysis, temporal network modeling, bipartite, multilayer, and hypergraph network analysis, computational text analysis, LLM interpretability, and graph neural network modeling such as EvolveGCN to study how institutional design and network structure shape political interactions.
#   </p>

#   <p>
#     My dissertation, which I defended in August 2026, examines why some soft-law and non-binding intergovernmental organizations remain effective despite weak enforcement. Using APEC as my primary case, I argue that cooperation in these settings is sustained not only by formal institutional design but also by relational hierarchy and networked strategic alignment. I show that cooperation in APEC is structured by bandwagoning and brokerage clustering: economies are more likely to form ties when potential partners are connected through stronger shared partners, and these clustering dynamics vary across issue domains depending on the attributes of the actors around which cooperation is organized.
#   </p>

#   <p>
#     My broader research includes work on how legal interventions and climate shocks reshape human trafficking networks, China&rsquo;s participation in ISO standard-setting, and the resilience of global order under contemporary geopolitical fragmentation. A coauthored paper on human trafficking and climate shocks is currently under conditional acceptance at <em>International Studies Quarterly</em>, and other research is currently under review. Before beginning my Ph.D., I worked on APEC policy and capacity-building initiatives at the Taiwan Institute of Economic Research and served as coordinator for Taiwan&rsquo;s Bureau of Small and Medium Enterprise to APEC. For more details, please visit my <a href="/research/" target="_blank">research page</a>.
#   </p>

#   <p>
#     I regard teaching as inseparable from research rather than secondary to it, and the chance to teach was one reason I left several years of think-tank and policy work for doctoral study. At Indiana University, I taught across Political Science and Informatics as Instructor of Record for <em>Politics of Global Governance</em> and <em>Data Fluency</em>, and as Associate Instructor for courses including <em>International Organization</em>, <em>Analyzing Politics</em>, and <em>Introduction to Informatics</em>. My classrooms are built around active learning: flipped-classroom activities, real-time polling, case analysis, and assignments that ask students to write for decision-makers and citizens rather than only for other academics. In <em>Data Fluency</em>, students generated a network of their own classroom conversations, entered it into a shared dataset, and analyzed it, which showed them that relational data are not abstractions invented by researchers but records of ordinary behavior.
#   </p>

#   <p>
#     Generative artificial intelligence has changed what students most need from a methods course. As routine execution becomes inexpensive, the distinctly human contribution moves upstream to problem definition and downstream to judgment and communication. I therefore teach design thinking alongside technical skill, and I design assessment so that independent understanding stays visible without banning the tools students will use for the rest of their careers. I am prepared to teach international relations at the introductory, intermediate, and advanced levels, along with research methods, computational social science, social network analysis, and <em>R</em> for political data analysis, and I welcome the chance to supervise capstone and independent research in which students build and analyze their own data. As Co-Chair of my department&rsquo;s Diversity, Equity, Inclusion, and Justice Committee, I worked to make sure that students and colleagues of different backgrounds had a real place in the conversation, a commitment that carries directly into how I run a classroom. I also develop introductory materials for data analysis and computational social science; for example, see my <a href="https://jeffery-wang.com/r-basics/" target="_blank">R Tutorial page</a>. For more details, please visit my <a href="/teaching/" target="_blank">teaching page</a>.
#   </p>

#   <p>
#     My research has been supported by the Taiwanese Overseas Pioneers Ph.D. Dissertation Grant from Taiwan&rsquo;s National Science and Technology Council (USD 30,000) and the Taiwanese Government Fellowship for Overseas Ph.D. Study from the Ministry of Education (USD 188,000).
#   </p>

