short_bio: >-
  <p>
    Welcome to my website. I am a Ph.D. candidate in <a href="https://polisci.indiana.edu/index.html" target="_blank">Political Science</a> at Indiana University Bloomington, where I also pursue interdisciplinary training in <a href="https://informatics.indiana.edu/index.html" target="_blank">Informatics</a> through the NSF-funded <a href="https://cns.iu.edu/docs/handouts/CNetS-NRT-lo.pdf" target="_blank">Interdisciplinary Dual Ph.D. Program in Complex Networks and Systems</a>.
  </p>

  <p>
  My research examines how global governance and international cooperation evolve through relational networks, institutional design, domestic legalization, and external shocks such as climate change. I focus on three main areas: strategic alignment in international institutions, especially informal and non-binding ones; how domestic policies and climate-related shocks reshape transnational flows of people, goods, and vulnerability; and how cooperation networks shape the resilience and evolution of global order. Methodologically, I draw on multimodal data processing, social network analysis, temporal network modeling, bipartite, multilayer, and hypergraph network analysis, computational text analysis, LLM interpretability, and graph neural network modeling such as EvolveGCN to study how institutional design and network structure shape political interactions.
  </p>

  <p>
    My dissertation examines why some soft-law and non-binding intergovernmental organizations remain effective despite weak enforcement. Using APEC as my primary case, I argue that cooperation in these settings is sustained not only by formal institutional design but also by relational hierarchy and networked strategic alignment. I show that cooperation in APEC is structured by bandwagoning and brokerage clustering: economies are more likely to form ties when potential partners are connected through stronger shared partners, and these clustering dynamics vary across issue domains depending on the attributes of the actors around which cooperation is organized.
  </p>

  <p>
    My broader research includes work on how legal interventions and climate shocks reshape human trafficking networks, China’s participation in ISO standard-setting, and the resilience of global order under contemporary geopolitical fragmentation. A coauthored paper on human trafficking and climate shocks is currently under revise-and-resubmit at <em>International Studies Quarterly</em>, and other research is currently under review at <em>International Interactions</em> and other journals. Before beginning my Ph.D., I worked on APEC policy and capacity-building initiatives at the Taiwan Institute of Economic Research and served as coordinator for Taiwan’s Bureau of Small and Medium Enterprise to APEC. For more details, please visit my <a href="/research/" target="_blank">research page</a>.
  </p>

  <p>
    At Indiana University, I have taught across Political Science and Informatics as Instructor of Record for <em>Politics of Global Governance</em> and <em>Data Fluency</em>, and as Associate Instructor for courses including <em>International Organization</em>, <em>Analyzing Politics</em>, and <em>Introduction to Informatics</em>. I also teach <em>R</em> and develop introductory materials for data analysis and computational social science; for example, see my <a href="https://jeffery-wang.com/r-basics/" target="_blank">R Tutorial page</a>. For more details, please visit my <a href="/teaching/" target="_blank">teaching page</a>. 
  <p>
  
  <p>
  My research has been supported by the Taiwanese Overseas Pioneers Ph.D. Dissertation Grant from Taiwan’s National Science and Technology Council (USD 30,000) and the Taiwanese Government Fellowship for Overseas Ph.D. Study from the Ministry of Education (USD 188,000). 
  </p>

